name: Release
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: 22

            -   name: Install Dependencies
                run: bun install

            -   name: Test
                run: bun run test

            -   name: Check tag matches package version
                if: github.ref_type == 'tag'
                run: |
                    set -eu
                    TAG="${GITHUB_REF_NAME#v}"
                    VERSION="$(bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
                    if [ "$TAG" != "$VERSION" ]; then
                      echo "package.json version ${VERSION} does not match tag ${GITHUB_REF_NAME}"
                      exit 1
                    fi
                    echo "package.json version ${VERSION} matches ${GITHUB_REF_NAME}"

            -   name: Build
                run: bun run zip

            -   name: Verify zip contents
                run: |
                    set -eu
                    VERSION="$(bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
                    bun scripts/verify-release-zip.ts "$VERSION"

            -   name: Extract changelog notes
                if: github.ref_type == 'tag'
                run: |
                    set -eu
                    bun scripts/extract-changelog.ts "${GITHUB_REF_NAME#v}" CHANGELOG.md > release-notes.md

            -   name: Create GitHub Release
                if: github.ref_type == 'tag'
                env:
                    GH_TOKEN: ${{ github.token }}
                    GH_REPO: Baegovda/BongChrome
                run: |
                    set -eu
                    TAG="${GITHUB_REF_NAME}"
                    VERSION="${TAG#v}"
                    ZIP=".output/bongchrome-${VERSION}-chrome.zip"
                    if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" "$ZIP" --clobber
                      gh release edit "$TAG" --notes-file release-notes.md
                    else
                      gh release create "$TAG" "$ZIP" --title "BongChrome ${VERSION}" --notes-file release-notes.md
                    fi
