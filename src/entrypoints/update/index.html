<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BongChrome 업데이트</title>
    <style>
        body {
            background: #f6f7f9;
            color: #1c1c1c;
            font: 15px/1.5 sans-serif;
            margin: 48px auto;
            max-width: 560px;
            padding: 0 16px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px;
        }

        #ver {
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 16px;
        }

        button {
            background: #fff;
            border: 1px solid #c8cdd6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 0 8px 8px 0;
            padding: 8px 16px;
        }

        button:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #start:not(:disabled) {
            background: #006eff;
            border-color: #006eff;
            color: #fff;
        }

        #status {
            color: #444;
            margin: 12px 0;
        }

        #error {
            color: #c62828;
            white-space: pre-wrap;
        }

        .note {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
<h1>BongChrome 업데이트</h1>
<p id="ver"></p>
<p id="status">최신 버전 확인 중…</p>
<button id="start" type="button" disabled>폴더 선택/업데이트 시작</button>
<button id="resume" type="button" hidden>중단된 업데이트가 있습니다. 이어서 완료</button>
<p id="error" role="alert"></p>
<p class="note">처음 한 번은 chrome://extensions 에 불러온 BongChrome 폴더(manifest.json이 있는 폴더)를 선택하세요. 다운로드나 바탕화면 폴더 자체는 크롬이 고르지 못하게 막습니다.</p>
<script src="./main.ts" type="module"></script>
</body>
</html>
