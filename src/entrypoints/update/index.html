<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BongExtend 업데이트</title>
    <style>
        body { font-size: 14px; }
        .wrap { max-width: 560px; margin: 56px auto; padding: 0 16px; }
        .be-card { padding: 24px; }
        .title { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .title img { border-radius: 10px; }
        .title h1 { margin: 0; font-size: 20px; }
        #ver { font-size: 26px; font-weight: 700; margin: 12px 0 8px; background: var(--be-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .be-page button { font-size: 14px; padding: 9px 16px; border-radius: var(--be-radius); margin: 0 8px 8px 0; }
        #status { color: var(--be-text-2); margin: 12px 0 16px; }
        #error { color: var(--be-error); white-space: pre-wrap; }
        .note { color: var(--be-muted); font-size: 12px; line-height: 1.6; margin: 8px 0 0; word-break: keep-all; }
    </style>
</head>
<body class="be-page">
<div class="wrap"><div class="be-card">
<div class="title"><img alt="" height="36" src="/icons/48.png" width="36"><h1>BongExtend 업데이트</h1></div>
<p id="ver"></p>
<p id="status">최신 버전 확인 중…</p>
<button class="primary" id="start" type="button" disabled>폴더 선택/업데이트 시작</button>
<button id="resume" type="button" hidden>중단된 업데이트가 있습니다. 이어서 완료</button>
<p id="error" role="alert"></p>
<p class="note">처음 한 번은 chrome://extensions 에 불러온 BongExtend 폴더(manifest.json이 있는 폴더)를 선택하세요. 다운로드나 바탕화면 폴더 자체는 크롬이 고르지 못하게 막습니다.</p>
</div></div>
<script src="./main.ts" type="module"></script>
</body>
</html>
