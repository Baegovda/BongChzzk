<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BongExtend 번역</title>
    <link rel="stylesheet" href="/theme/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="be-page be-shell">
    <div class="be-title">
      <h3>번역</h3>
      <span class="be-sub" id="meta">Gemini</span>
    </div>
    <div class="be-grid">
      <div class="be-col">
        <section class="be-card be-sec">
          <h4>이 페이지 번역</h4>
          <label class="be-row switch">
            <span class="be-row-text">
              <span>페이지 번역 <strong id="switchState">OFF</strong></span>
              <small>켜면 보이는 문장부터 번역합니다</small>
            </span>
            <input id="enabled" type="checkbox" role="switch" aria-label="번역">
          </label>
        </section>
        <section class="be-card be-sec">
          <h4>상태</h4>
          <p id="status" role="status"></p>
        </section>
      </div>
      <div class="be-col">
        <section class="be-card be-sec">
          <h4>설정</h4>
          <div class="be-row">
            <span class="be-row-text"><span>API 키·모델·언어·캐시</span><small>새 탭에서 번역 설정을 엽니다</small></span>
            <button id="options" type="button">설정 열기</button>
          </div>
          <div class="tools be-actions" hidden>
            <button id="checkUpdate" type="button">업데이트 확인</button>
            <button id="manage" type="button">확장 프로그램 관리</button>
          </div>
          <p id="updateStatus" role="status" hidden></p>
          <p id="updateLinks" class="be-actions" hidden>
            <button class="primary" id="doUpdate" type="button" hidden>지금 업데이트</button>
            <button id="openRelease" type="button">릴리스 페이지</button>
            <button id="openZip" type="button">zip 다운로드</button>
          </p>
        </section>
        <section class="be-card be-sec">
          <h4>사용법</h4>
          <p class="be-hint">페이지에서 오른쪽 클릭 → <b>BongExtend: 페이지 번역 켜기/끄기</b>로도 켜고 끌 수 있습니다. 업데이트는 <b>업데이트·설정</b> 탭에서 확인합니다.</p>
        </section>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
