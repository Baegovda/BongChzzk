<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BongExtend 번역</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" width="32" height="32" alt="">
      <div>
        <h1>번역</h1>
        <p id="meta">Gemini</p>
      </div>
    </header>
    <label class="switch">
      <input id="enabled" type="checkbox" role="switch" aria-label="번역">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      <span class="switch-copy">
        <strong id="switchState">OFF</strong>
        <small>이 페이지 번역</small>
      </span>
    </label>
    <p id="status" role="status"></p>
    <div class="tools" hidden>
      <button id="checkUpdate" type="button">업데이트 확인</button>
      <button id="manage" type="button">확장 프로그램 관리</button>
    </div>
    <p id="updateStatus" role="status" hidden></p>
    <p id="updateLinks" hidden>
      <button id="doUpdate" type="button" hidden>지금 업데이트</button>
      <button id="openRelease" type="button">릴리스 페이지</button>
      <button id="openZip" type="button">zip 다운로드</button>
    </p>
    <footer>
      <span></span>
      <button id="options" type="button">설정</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
