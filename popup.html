<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>body{width:250px;font:13px sans-serif;padding:10px;background:#141517;color:#eee}h3{margin:0 0 6px;color:#00ffa3}h4{margin:10px 0 2px;font-size:11px;color:#888;border-bottom:1px solid #2a2a2a;padding-bottom:2px}label{margin:5px 0!important}label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}input[type=number]{width:60px}.c{margin-top:12px;padding-top:8px;border-top:1px solid #333;color:#aaa}button{font-size:11px}.tools{margin-top:10px;display:flex;gap:6px}#updateStatus{color:#aaa;margin:6px 0;word-break:keep-all}#updateStatus.error{color:#ff6b6b}</style>
</head><body>
<h3>BongChzzk</h3>
<h4>버퍼링 복구</h4>
<label>자동 복구 사용<input type="checkbox" id="enabled"></label>
<label>버퍼링 판정(초)<input type="number" id="threshold" min="2" max="60"></label>
<label>복구 간격(초)<input type="number" id="cooldown" min="3" max="120"></label>
<label>화면 알림 표시<input type="checkbox" id="toast"></label>
<h4>화면</h4>
<label>화질 1080p 고정<input type="checkbox" id="lockQuality"></label>
<label>고정 화질<select id="targetQuality"><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></label>
<label>방송 진입 시 넓은 화면 자동<input type="checkbox" id="autoWide"></label>
<label>선명한 화면 항상 켜기<input type="checkbox" id="vivid"></label>
<label>타임머신 안내창 숨김<input type="checkbox" id="hideTimeGuide"></label>
<label>광고 방지(실험적)<input type="checkbox" id="adSkip"></label>
<label>플레이어 시청자 수 표시<input type="checkbox" id="viewerOverlay"></label>
<h4>조작</h4>
<label>방향키로 5초 이동<input type="checkbox" id="arrowSeek"></label>
<label>건너뛰기 초<select id="seekSeconds"><option value="5">5초</option><option value="10">10초</option><option value="15">15초</option><option value="30">30초</option></select></label>
<h4>채팅</h4>
<label>채팅 헤더 시청자 수<input type="checkbox" id="viewerChat"></label>
<label>주간 랭킹 가리기<input type="checkbox" id="hideRanking"></label>
<label>후원 랭킹 닉네임 가리기<input type="checkbox" id="blurRankNames"></label>
<label>채팅 글씨 크기 <span><input type="range" id="chatFontSize" min="12" max="28" step="1" style="width:80px;vertical-align:middle"> <b id="chatFontLabel">기본</b> <button id="chatFontReset" type="button">기본</button></span></label>
<h4>팔로잉</h4>
<label>팔로잉 채널 자동 새로고침<input type="checkbox" id="followRefresh"></label>
<label>새로고침 간격<select id="followInterval"><option value="5">5초</option><option value="10">10초</option><option value="30">30초</option><option value="60">60초</option></select></label>
<h4>관심 스트리머 자동 이동</h4>
<label>방송 시작 시 자동 이동<input type="checkbox" id="watchEnabled"></label>
<div style="display:flex;gap:4px"><input id="watchInput" placeholder="채널 URL 또는 ID" style="flex:1;min-width:0;font-size:11px"><button id="watchAdd" type="button">추가</button></div>
<div style="display:flex;gap:4px;margin-top:4px"><button id="watchCurrent" type="button">현재 보는 채널 추가</button><button id="watchGoNow" type="button">지금 방송 중이면 이동</button></div>
<p id="watchMsg" style="color:#aaa;margin:4px 0;font-size:11px"></p>
<ul id="watchListEl" style="list-style:none;padding:0;margin:0;font-size:12px"></ul>
<div class="c">복구 횟수: <b id="count">0</b> <button id="reset">초기화</button><div id="last"></div></div>
<div class="tools">
  <button id="checkUpdate" type="button">업데이트 확인</button>
  <button id="manage" type="button">확장 프로그램 관리</button>
</div>
<p id="updateStatus" role="status"></p>
<p id="updateLinks" hidden>
  <button id="openRelease" type="button">릴리스 페이지</button>
  <button id="openZip" type="button">zip 다운로드</button>
  <button id="doUpdate" type="button" hidden>지금 업데이트</button>
</p>
<script src="lib/watch.js"></script>
<script type="module" src="popup.js"></script></body></html>
