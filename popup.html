<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>body{width:250px;font:13px sans-serif;padding:10px;background:#141517;color:#eee}h3{margin:0 0 10px;color:#00ffa3}label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}input[type=number]{width:60px}.c{margin-top:12px;padding-top:8px;border-top:1px solid #333;color:#aaa}button{font-size:11px}</style>
</head><body>
<h3>BongChzzk</h3>
<label>자동 복구 사용<input type="checkbox" id="enabled"></label>
<label>버퍼링 판정(초)<input type="number" id="threshold" min="2" max="60"></label>
<label>복구 간격(초)<input type="number" id="cooldown" min="3" max="120"></label>
<label>화면 알림 표시<input type="checkbox" id="toast"></label>
<div class="c">복구 횟수: <b id="count">0</b> <button id="reset">초기화</button><div id="last"></div></div>
<script src="popup.js"></script></body></html>
